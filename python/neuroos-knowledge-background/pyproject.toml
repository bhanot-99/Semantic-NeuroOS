# neuroos-knowledge-background [C5b] uv project manifest
[project]
name = "neuroos-bg"
version = "0.1.0"
description = "Background knowledge worker (APPNP propagation, Hawkes decay, pruning)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "protobuf>=4.21,<5",
    "scipy>=1.18.1",
]

# H12: the entry point deploy/systemd/neuroos-knowledge-background.service
# starts (installed as /opt/neuroos/bin/neuroos-knowledge-background).
[project.scripts]
neuroos-knowledge-background = "neuroos_bg.main:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "hypothesis>=6.168.3",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroos_bg", "src/neuroos"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/neuroos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["src/neuroos/"]

[[tool.mypy.overrides]]
module = "neuroos.*"
ignore_errors = true
ignore_missing_imports = true
