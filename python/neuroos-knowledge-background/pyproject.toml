# neuroos-knowledge-background [C5b] uv project manifest
[project]
name = "neuroos-bg"
version = "0.1.0"
description = "Background knowledge worker (APPNP propagation, Hawkes decay, pruning)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    # L15: was `>=4.21,<5`, which resolved to protobuf 4.25.x. Its `_upb`
    # extension emits two `DeprecationWarning`s on import ("uses
    # PyType_Spec with a metaclass that has custom tp_new ... will no
    # longer be allowed in Python 3.14"), so C5b's worker will stop
    # importing its own protos on 3.14. 5.x and 6.x both load this
    # package's protoc-generated `_pb2` modules unchanged and warn-free
    # (checked against 5.29.5 and 6.33.1), so the ceiling moves to the
    # next major instead.
    "protobuf>=5.29,<7",
    "scipy>=1.18.1",
]

# H12: the entry point deploy/systemd/neuroos-knowledge-background.service
# starts (installed as /opt/neuroos/bin/neuroos-knowledge-background).
[project.scripts]
neuroos-knowledge-background = "neuroos_bg.main:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "hypothesis>=6.168.3",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# L15: `src/neuroos/v1/*_pb2.py(i)` are generated by `just proto-py` and
# are in .gitignore, which hatchling honours when selecting files -- so
# even on a tree where they existed, the wheel shipped `neuroos/v1/` with
# only its `__init__.py` in it and the installed C5b service died on its
# first `neuroos.v1.*` import. `artifacts` overrides the VCS ignore for
# exactly these generated files.
[tool.hatch.build]
artifacts = [
    "src/neuroos/v1/*_pb2.py",
    "src/neuroos/v1/*_pb2.pyi",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neuroos_bg", "src/neuroos"]

# L15: `src/neuroos/v1/*_pb2.py` is generated by `just proto-py` and
# gitignored, so without this a build on a fresh checkout shipped an empty
# `neuroos` package and the installed service failed at its first import.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/neuroos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["src/neuroos/"]

[[tool.mypy.overrides]]
module = "neuroos.*"
ignore_errors = true
ignore_missing_imports = true

# L15: hatchling is a build-system requirement (PEP 518), not a dev
# dependency, so it is not installed in the venv mypy runs against.
[[tool.mypy.overrides]]
module = "hatchling.*"
ignore_missing_imports = true
