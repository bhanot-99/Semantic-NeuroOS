# neuroos-storage [C3]
[package]
name = "neuroos-storage"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
neuroos-common = { path = "../neuroos-common", version = "0.1.0" }
neuroos-ipc = { path = "../neuroos-ipc", version = "0.1.0" }
neuroos-proto = { path = "../neuroos-proto", version = "0.1.0" }
neuroos-taint = { path = "../neuroos-taint", version = "0.1.0" }
thiserror = "2"
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
fastembed = { version = "7", default-features = false, features = ["ort-load-dynamic"] }
lancedb = { version = "=0.15", default-features = false }
arrow-array = "=53.4.1"
arrow-schema = "=53.4.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"

[dev-dependencies]
proptest = "1"
tempfile = "3"
