# neuroos-healthd [D]
[package]
name = "neuroos-healthd"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
neuroos-common = { path = "../neuroos-common", version = "0.1.0" }
neuroos-health = { path = "../neuroos-health", version = "0.1.0" }
neuroos-ipc = { path = "../neuroos-ipc", version = "0.1.0" }
neuroos-proto = { path = "../neuroos-proto", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync", "signal"] }
thiserror = "2"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
neuroos-testkit = { path = "../neuroos-testkit", version = "0.1.0" }
tempfile = "3"
