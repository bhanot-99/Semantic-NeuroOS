# neuroosctl operator CLI
[package]
name = "neuroosctl"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
neuroos-common = { path = "../neuroos-common", version = "0.1.0" }
neuroos-health = { path = "../neuroos-health", version = "0.1.0" }
neuroos-ipc = { path = "../neuroos-ipc", version = "0.1.0" }
neuroos-proto = { path = "../neuroos-proto", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
neuroos-healthd = { path = "../neuroos-healthd", version = "0.1.0" }
neuroos-knowledge-query = { path = "../neuroos-knowledge-query", version = "0.1.0" }
neuroos-testkit = { path = "../neuroos-testkit", version = "0.1.0" }
tempfile = "3"
