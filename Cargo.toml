# Rust workspace root
[workspace]
resolver = "2"
members = [
    "crates/neuroos-common",
    "crates/neuroos-proto",
    "crates/neuroos-ipc",
    "crates/neuroos-shm",
    "crates/neuroos-taint",
    "crates/neuroos-health",
    "crates/neuroos-sandbox",
    "crates/neuroos-testkit",
    "crates/neuroos-healthd",
    "crates/neuroos-monitor",
    "crates/neuroos-storage",
    "crates/neuroos-knowledge-query",
    "crates/neuroos-kernel",
    "crates/neuroos-confirm",
    "crates/neuroos-fetcher",
    "crates/neuroosctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# rules.md §5: no unwrap/expect/panic/todo in non-test code. `-D warnings` in
# `just lint-rust` escalates these to build failures. Test code (#[cfg(test)])
# is exempt by clippy's own scoping; one-off diagnostic/interop CLI tools get
# an explicit per-file `#![allow(...)]` with a comment, not a workspace-wide
# exemption.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

# C12: `target/` filled the disk three times during Phase 5, twice breaking a
# build mid-run. Full DWARF for every dep is the bulk of it, and incremental
# artifacts are the fastest-growing part, so the dev profile keeps only what a
# backtrace actually needs (file/line) and drops incremental. `just prune`
# clears the stale per-dep binaries that accumulate regardless.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
lto = "thin"

# lancedb 0.39.0's job.rs references Error::Http unconditionally even
# though that variant is #[cfg(feature = "remote")]-gated in error.rs — a
# real upstream bug that breaks the build with default-features off (which
# neuroos-storage needs: enabling "remote" pulls reqwest/hyper into C3,
# violating rules.md R0-1 — no HTTP client outside C7). vendor/ has the
# same 0.39.0 source with only that function's 2 match arms fixed (see the
# PATCHED comment in vendor/lancedb-0.39.0-patched/src/job.rs); everything
# else, including every genuinely `remote`-gated Error::Http use, is
# untouched. Revisit if a later release fixes this upstream.
# rules.md R0-1: lance 12.0.0 (lancedb 0.39.0's dependency) unconditionally
# depends on lance-namespace, which unconditionally depends on
# lance-namespace-reqwest-client, which unconditionally links reqwest ->
# hyper -> hyper-util -- with no upstream Cargo feature to disable it, even
# though nothing lance/lancedb actually calls (with namespace/remote
# features off, as neuroos-storage has them) ever reaches that crate's
# `apis` module (the only part that uses reqwest); only its reqwest-free
# `models` (data types) module is used. vendor/ has both crates patched to
# make reqwest+`apis` opt-in via a new "client" feature, off by default --
# see the PATCHED comments in each vendored Cargo.toml/lib.rs.
[patch.crates-io]
lancedb = { path = "vendor/lancedb-0.39.0-patched" }
lance-namespace = { path = "vendor/lance-namespace-12.0.0-patched" }
lance-namespace-reqwest-client = { path = "vendor/lance-namespace-reqwest-client-0.12.0-patched" }
