# Rust workspace root
[workspace]
resolver = "2"
members = [
    "crates/neuroos-common",
    "crates/neuroos-proto",
    "crates/neuroos-ipc",
    "crates/neuroos-shm",
    "crates/neuroos-taint",
    "crates/neuroos-health",
    "crates/neuroos-sandbox",
    "crates/neuroos-testkit",
    "crates/neuroos-healthd",
    "crates/neuroos-monitor",
    "crates/neuroos-storage",
    "crates/neuroos-knowledge-query",
    "crates/neuroos-kernel",
    "crates/neuroos-confirm",
    "crates/neuroos-fetcher",
    "crates/neuroosctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# rules.md §5: no unwrap/expect/panic/todo in non-test code. `-D warnings` in
# `just lint-rust` escalates these to build failures. Test code (#[cfg(test)])
# is exempt by clippy's own scoping; one-off diagnostic/interop CLI tools get
# an explicit per-file `#![allow(...)]` with a comment, not a workspace-wide
# exemption.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

[profile.release]
lto = "thin"
