# Rust workspace root
[workspace]
resolver = "2"
members = [
    "crates/neuroos-common",
    "crates/neuroos-proto",
    "crates/neuroos-ipc",
    "crates/neuroos-shm",
    "crates/neuroos-taint",
    "crates/neuroos-health",
    "crates/neuroos-sandbox",
    "crates/neuroos-testkit",
    "crates/neuroos-healthd",
    "crates/neuroos-monitor",
    "crates/neuroos-storage",
    "crates/neuroos-knowledge-query",
    "crates/neuroos-kernel",
    "crates/neuroos-confirm",
    "crates/neuroos-fetcher",
    "crates/neuroosctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# rules.md §5: no unwrap/expect/panic/todo in non-test code. `-D warnings` in
# `just lint-rust` escalates these to build failures. Test code (#[cfg(test)])
# is exempt by clippy's own scoping; one-off diagnostic/interop CLI tools get
# an explicit per-file `#![allow(...)]` with a comment, not a workspace-wide
# exemption.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

[profile.release]
lto = "thin"

# lancedb 0.39.0's job.rs references Error::Http unconditionally even
# though that variant is #[cfg(feature = "remote")]-gated in error.rs — a
# real upstream bug that breaks the build with default-features off (which
# neuroos-storage needs: enabling "remote" pulls reqwest/hyper into C3,
# violating rules.md R0-1 — no HTTP client outside C7). vendor/ has the
# same 0.39.0 source with only that function's 2 match arms fixed (see the
# PATCHED comment in vendor/lancedb-0.39.0-patched/src/job.rs); everything
# else, including every genuinely `remote`-gated Error::Http use, is
# untouched. Revisit if a later release fixes this upstream.
[patch.crates-io]
lancedb = { path = "vendor/lancedb-0.39.0-patched" }
