// shared proto types (ids, timestamps, taint flags)
syntax = "proto3";
package neuroos.v1;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_UNAVAILABLE = 3;
  ERROR_CODE_DEADLINE_EXCEEDED = 4;
  ERROR_CODE_PERMISSION_DENIED = 5;
  ERROR_CODE_INTERNAL = 6;
}

// mirrors Rust neuroos-taint::TaintFlags (Architecture.md §7.4)
message Taint {
  uint32 flags = 1;
}
