// C3 storage engine types
syntax = "proto3";
package neuroos.v1;

import "neuroos/v1/common.proto";

message IngestRequest {
  string source = 1;
  bytes payload = 2;
}

message IngestResponse {
  bool accepted = 1;
}

// FR-STO-06 / Architecture.md §6.1: the deictic-snap query ("what was I
// looking at when I said this").
message QueryFocusHistoryRequest {
  uint64 t_ns = 1;
  uint64 window_ns = 2;
}

message FocusHistoryRow {
  string app_id = 1;
  string title = 2;
  uint32 pid = 3;
  uint32 root_pid = 4;
  uint64 t_start_ns = 5;
  uint64 t_end_ns = 6;
  uint64 dwell_ms = 7;
}

message QueryFocusHistoryResponse {
  // unset (prost: None) iff nothing overlapped the window.
  FocusHistoryRow row = 1;
}

// FR-STO-05 / FR-KNO-03: QueryHybridVectorText.
message QueryHybridRequest {
  string text = 1;
  uint32 top_k = 2;
}

message ChunkMatch {
  string chunk_id = 1;
  int64 entity_id = 2;
  string text = 3;
  Taint taint = 4;
  uint64 t_ns = 5;
  string domain = 6;
  float distance = 7;
  // BUG-007(b): how many distinct (non-stopword) question terms this chunk
  // contains, set for chunks C3's FTS keyword index returned; 0 when the
  // chunk came from vector search alone. Keyword-only hits carry
  // distance = 2 (cosine-distance maximum, i.e. unknown).
  float keyword_score = 8;
}

message QueryHybridResponse {
  repeated ChunkMatch matches = 1;
}

// FR-STO-12 / FR-PRV-03: forget a time range or an app.
message ForgetRequest {
  oneof target {
    string app_id = 1;
    uint64 since_ns = 2;
  }
}

message ForgetResponse {
  uint64 forgotten = 1;
}

// FR-KNO-10 / Architecture.md §7.2: the Python cold worker's read/write
// surface onto `entities`/`edges` -- AB-1 forbids it linking
// `neuroos-storage` (or even SQLite) directly, so this is the only way it
// reaches the graph.
message EntityRow {
  int64 id = 1;
  string domain = 2;
  string kind = 3;
  string label = 4;
  uint32 taint = 5;
  uint64 created_ns = 6;
  uint64 last_seen_ns = 7;
  bool permanent = 8;
}

// since_ns = 0 means "every entity"; otherwise only entities last seen at
// or after this instant (the cold worker only needs recently-active ones
// to build co-occurrence candidates each job run).
message ListEntitiesRequest {
  uint64 since_ns = 1;
}

message ListEntitiesResponse {
  repeated EntityRow entities = 1;
}

message EdgeRow {
  int64 src = 1;
  int64 dst = 2;
  string kind = 3;
  float weight = 4;
  uint64 reinforced_ns = 5;
  bool hypothesis = 6;
}

message ListEdgesRequest {}

message ListEdgesResponse {
  repeated EdgeRow edges = 1;
}

// Creates `(src, dst, kind)` if absent, otherwise replaces its
// weight/reinforced_ns/hypothesis -- re-writing an edge the cold worker
// still believes in is exactly how it resets the 72h TTL (Architecture.md
// §7.2's "hypotheses: 72h TTL unless reinforced").
message UpsertEdgeRequest {
  EdgeRow edge = 1;
}

message UpsertEdgeResponse {
  bool ok = 1;
}

// FR-KNO-10: "prune unreinforced edges after 72h" -- deletes every
// hypothesis edge whose reinforced_ns is older than `older_than_ns`.
// Non-hypothesis (confirmed) edges are never pruned by this call.
message PruneEdgesRequest {
  uint64 older_than_ns = 1;
}

message PruneEdgesResponse {
  uint64 pruned = 1;
}

// BUG-007: structured activity for broad and temporal questions ("what did
// I do most", "the last episode", "before X"), which vector/keyword chunk
// retrieval can't answer (TimelineQA, Tan et al. 2023: aggregation needs
// a small, structured evidence set). Time bounds are inclusive UTC ns;
// until_ns = 0 means no upper bound.
message QueryActivityRequest {
  uint64 since_ns = 1;
  uint64 until_ns = 2;
  uint32 limit = 3;
}

message ActivityItem {
  string app_id = 1;
  // window title, or a media chunk's text ("vlc played ...")
  string text = 2;
  uint64 first_ns = 3;
  uint64 last_ns = 4;
  // total focused time; 0 for media
  uint64 dwell_ms = 5;
}

message QueryActivityResponse {
  // focused window titles, most total dwell first
  repeated ActivityItem windows = 1;
  // media started in range, oldest first
  repeated ActivityItem media = 2;
}
