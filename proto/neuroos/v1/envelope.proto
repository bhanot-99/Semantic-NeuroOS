// IPC envelope contract shared by all components
syntax = "proto3";
package neuroos.v1;

import "neuroos/v1/common.proto";
import "neuroos/v1/health.proto";
import "neuroos/v1/telemetry.proto";
import "neuroos/v1/voice.proto";
import "neuroos/v1/storage.proto";
import "neuroos/v1/inference.proto";
import "neuroos/v1/knowledge.proto";
import "neuroos/v1/kernel.proto";
import "neuroos/v1/fetcher.proto";
import "neuroos/v1/healthd.proto";

message Envelope {
  uint32 schema_version = 1;   // always 1 for package v1
  string trace_id       = 2;   // 128-bit hex, propagated end to end
  uint64 request_id     = 3;   // correlation id; 0 for push events
  uint64 sent_at_ns     = 4;   // UTC epoch nanoseconds

  // field-number ranges per component (Architecture.md §5.3):
  // 10-19 common, 20-29 C1, 30-39 C2, 40-59 C3, 60-69 C4, 70-89 C5,
  // 90-109 C6, 110-119 C7, 120-129 healthd, 130-139 C4 overflow
  // (ADR-0013: 60-69 is full)
  oneof body {
    Error                error           = 10;
    HealthRequest        health_request  = 11;
    HealthResponse       health_response = 12;

    RawTelemetryEvent    telemetry       = 20;
    MonitorPauseRequest  monitor_pause_request   = 21;
    MonitorPauseResponse monitor_pause_response  = 22;
    MonitorStatusRequest  monitor_status_request  = 23;
    MonitorStatusResponse monitor_status_response = 24;

    VoiceCommand         voice_command   = 30;
    PreambleRequest      preamble        = 31;
    PreambleResponse     preamble_response = 32;

    IngestRequest        ingest_request  = 40;
    IngestResponse       ingest_response = 41;
    QueryFocusHistoryRequest  query_focus_history_request  = 42;
    QueryFocusHistoryResponse query_focus_history_response = 43;
    QueryHybridRequest        query_hybrid_request         = 44;
    QueryHybridResponse       query_hybrid_response        = 45;
    ForgetRequest              forget_request  = 46;
    ForgetResponse             forget_response = 47;
    ListEntitiesRequest        list_entities_request  = 48;
    ListEntitiesResponse       list_entities_response = 49;
    ListEdgesRequest           list_edges_request  = 50;
    ListEdgesResponse          list_edges_response = 51;
    UpsertEdgeRequest          upsert_edge_request  = 52;
    UpsertEdgeResponse         upsert_edge_response = 53;
    PruneEdgesRequest          prune_edges_request  = 54;
    PruneEdgesResponse         prune_edges_response = 55;
    QueryActivityRequest       query_activity_request  = 56;
    QueryActivityResponse      query_activity_response = 57;
    MaintenanceRequest         maintenance_request  = 58; // ADR-0011
    MaintenanceResponse        maintenance_response = 59;

    GenerateRequest      generate_request     = 60;
    GenerateResponse     generate_response    = 61;
    CancelRequest        cancel_request       = 62;
    CancelResponse       cancel_response      = 63;
    DistillRequest       distill_request      = 64;
    DistillResponse      distill_response     = 65;
    AttachRingRequest    attach_ring_request  = 66;
    AttachRingResponse   attach_ring_response = 67;
    GetInfoRequest       get_info_request     = 68;
    GetInfoResponse      get_info_response    = 69;

    AskRequest           ask_request     = 70;
    AskResponse          ask_response    = 71;
    RenderGraphViewRequest  render_graph_view_request  = 72;
    RenderGraphViewResponse render_graph_view_response = 73;

    ActionRequest        action_request  = 90;
    ActionResponse       action_response = 91;

    FetchRequest          fetch_request  = 110;
    FetchResponse         fetch_response = 111;

    AggregateStatusRequest  aggregate_status_request  = 120;
    AggregateStatusResponse aggregate_status_response = 121;

    // C4 overflow (ADR-0013): C4's 60-69 range was exhausted by
    // Generate/Cancel/Distill/AttachRing/GetInfo.
    DetachRingRequest    detach_ring_request  = 130;
    DetachRingResponse   detach_ring_response = 131;
  }
}

message Error {
  ErrorCode code      = 1;
  string    message   = 2;   // never contains user content
  bool      retryable = 3;
}
