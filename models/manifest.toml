# model name, version, URL (for scripts only), sha256, licence
#
# Consumed by scripts/fetch-models.sh (P0-S09). Models are shipped as local
# files under /opt/neuroos/models/ (PRD "Models"); never downloaded at
# runtime by any component — only this script, run by the operator, ever
# fetches from a URL.
#
# `dest` is relative to the models root and matches Architecture.md §7.1's
# filesystem layout exactly. `license` values are checked against
# deny.toml's allowlist by this manifest's own schema, except openWakeWord
# (CC-BY-NC-SA-4.0), a known, pre-acknowledged exception — PRD R-06/R-07.

