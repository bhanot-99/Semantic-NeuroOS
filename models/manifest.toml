[[model]]
# Not itself a model — the ONNX Runtime C3's FastEmbed embedder (and C2's
# Silero/openWakeWord/Kokoro) load against. Architecture.md §12.3: "pinned
# release tarball with SHA-256", same convention as everything else here.
# `ort`'s ORT_DYLIB_PATH env var points at the extracted lib/libonnxruntime.so
# (rules.md R0-5: no runtime downloads — fastembed is built with
# `ort-load-dynamic`, never `ort-download-binaries`/`hf-hub`, so nothing
# downloads at build or run time except this operator script).
name = "onnxruntime-linux-x64"
component = "C3, C2"
url = "https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-x64-1.30.0.tgz"
dest = "onnxruntime/onnxruntime-linux-x64-1.30.0.tgz"
sha256 = "a5ed5a3cac51fbb2e90da632ae43d19212faaa20e76484e62bcb7c23ddb3b3fd"
license = "MIT"
archive = true
extract_to = "onnxruntime"
verify_file = "onnxruntime-linux-x64-1.30.0/lib/libonnxruntime.so"
